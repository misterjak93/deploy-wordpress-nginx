; =======================================================
; supervisord - nginx + PHP-FPM + cron WordPress
; =======================================================
; Un container solo per nginx e PHP-FPM e' una scelta, non una scorciatoia:
; comunicano su socket unix invece che in TCP, condividono la docroot senza
; volumi incrociati e si riavviano insieme quando cambia la versione di PHP.
; Il prezzo e' un supervisore, che serve perche' un container con un solo
; PID 1 non si accorgerebbe della morte del processo figlio.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid
loglevel = info

[unix_http_server]
file = /run/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/supervisor.sock

; -------------------------------------------------------
; PHP-FPM
; -------------------------------------------------------
; Parte per primo: nginx ha il fastcgi_pass su un socket unix che deve
; gia' esistere, altrimenti le prime richieste tornano 502.
[program:php-fpm]
command = /usr/sbin/php-fpm%(ENV_PHP_VER)s --nodaemonize --force-stderr --fpm-config /etc/php/%(ENV_PHP_VER)s/fpm/php-fpm.conf
priority = 10
autostart = true
autorestart = true
startsecs = 3
startretries = 3
stopsignal = QUIT
stopwaitsecs = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; -------------------------------------------------------
; nginx
; -------------------------------------------------------
[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
priority = 20
autostart = true
autorestart = true
startsecs = 3
startretries = 3
stopsignal = QUIT
stopwaitsecs = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; -------------------------------------------------------
; Cron di WordPress
; -------------------------------------------------------
; wp-config disattiva il cron interno (DISABLE_WP_CRON), che altrimenti
; parte dentro a una richiesta del visitatore: con Varnish davanti le
; richieste che arrivano a PHP sono poche e irregolari, quindi i job
; programmati non partirebbero quasi mai.
; Qui li esegue un loop dedicato, a intervallo fisso e fuori dal percorso
; delle richieste.
[program:wp-cron]
command = /usr/local/bin/wp-cron-runner.sh
priority = 30
autostart = %(ENV_WP_CRON_ENABLED)s
autorestart = true
startsecs = 5
stopwaitsecs = 70
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
