# =======================================================
# Cache di pagina nginx: quando NON usarla (contesto http)
# =======================================================
# Queste regole devono dire la stessa cosa del VCL di Varnish. Se i due
# livelli non sono d'accordo su cosa e' cacheabile, il risultato non e'
# "un po' meno cache": e' una pagina personale servita a un estraneo.
#
# La decisione finale sul TTL la prende comunque il mu-plugin, che manda
# "X-Accel-Expires" e lo fa valere su tutto il resto. Queste mappe sono
# la rete di sicurezza per quando il plugin non c'e' o e' disattivato.
#
# Stesse regole, ruoli diversi: le richieste con sessione WordPress
# Varnish non le guarda affatto - escono in cima al suo vcl_recv per non
# occupare RAM - mentre qui arrivano tutte, perche' e' nginx a servire
# l'area di amministrazione. Quello che queste mappe escludono dalla
# cache di pagina viene comunque servito da nginx: gli asset di wp-admin
# con sendfile e open_file_cache, il resto da PHP con OPcache e Redis
# dietro. Escludere non vuol dire rimandare tutto a PHP.

# Utenti con una sessione: loggati, commentatori, carrello pieno, pagina
# protetta da password. Contenuto personale, mai in cache condivisa.
map $http_cookie $cache_skip_cookie {
    default 0;
    "~*(wordpress_logged_in_|wordpress_sec_|wp-postpass_|comment_author_|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session_|edd_items_in_cart|wp-resetpass-)" 1;
}

# Solo GET e HEAD producono risposte riutilizzabili.
map $request_method $cache_skip_method {
    default 1;
    GET     0;
    HEAD    0;
}

# Percorsi e parametri che non vanno mai serviti da cache.
map $request_uri $cache_skip_uri {
    default 0;
    "~*^/(wp-admin|wp-login\.php|wp-cron\.php|xmlrpc\.php|wp-trackback\.php|wp-signup\.php|wp-activate\.php|wp-mail\.php)" 1;
    "~*^/wp-json/wp/v2/users"                                                 1;
    # Seconda porta della stessa risorsa: senza questa riga la lista utenti
    # sarebbe esclusa dalla cache su una strada e cacheabile sull'altra.
    "~*[?&]rest_route=/wp/v2/users"                                           1;
    "~*(\?|&)(preview|customize_changeset_uuid|customize_theme|unapproved|replytocom|nocache|wc-ajax|removed_item|add-to-cart|s)=" 1;
    "~*^/(cart|checkout|my-account|carrello|cassa|mio-account|account)(/|$)"   1;
}

# Un header di autorizzazione o un nonce REST indicano una richiesta
# autenticata anche senza cookie.
map $http_authorization $cache_skip_auth {
    default 1;
    ""      0;
}
map $http_x_wp_nonce $cache_skip_nonce {
    default 1;
    ""      0;
}

map "$cache_skip_cookie$cache_skip_method$cache_skip_uri$cache_skip_auth$cache_skip_nonce" $cache_skip {
    default  1;
    "00000"  0;
}
