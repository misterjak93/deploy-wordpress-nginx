# =======================================================
# Header di sicurezza
# =======================================================
# add_header non si eredita: appena una location ne dichiara uno, tutti
# quelli del livello superiore spariscono. Per questo lo snippet va
# incluso in ogni location che aggiunge header propri, non solo nel
# server block.
#
# Content-Security-Policy NON e' qui: una CSP sensata dipende dal tema e
# dai plugin installati, e una generica o blocca il sito o non protegge.
# Il README spiega come aggiungerla quando il sito e' stabile.

add_header X-Content-Type-Options       "nosniff" always;
add_header X-Frame-Options              "SAMEORIGIN" always;
add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
add_header Permissions-Policy           "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-site" always;

# Valorizzato dalla mappa $hsts_header solo per le richieste arrivate in
# HTTPS al bordo. Con valore vuoto nginx non emette l'header.
add_header Strict-Transport-Security    $hsts_header always;

# X-XSS-Protection e' deliberatamente assente: l'auditor XSS dei browser
# e' stato rimosso anni fa e l'header, dove ancora interpretato, ha
# introdotto vulnerabilita' proprie.
