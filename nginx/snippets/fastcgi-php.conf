# =======================================================
# Parametri FastCGI
# =======================================================
fastcgi_index           index.php;

fastcgi_param  SCRIPT_FILENAME    $document_root$fastcgi_script_name;
fastcgi_param  SCRIPT_NAME        $fastcgi_script_name;

# PATH_INFO non va inviato, per la stessa famiglia di ragioni per cui non
# va inviato PATH_TRANSLATED (spiegato qui sotto) - e il sintomo e' lo
# stesso: 403 con il corpo "Access denied.".
#
# In questo stack il path info e' STRUTTURALMENTE sempre vuoto: ogni
# location PHP o ha "try_files $uri =404" o e' un match esatto, quindi
# "/index.php/qualcosa" non arriva mai all'interprete. Ma
# "fastcgi_param PATH_INFO $fastcgi_path_info" lo mandava lo stesso, vuoto
# ma PRESENTE, e questo basta: php-fpm prende allora il ramo path-info e
# valuta security.limit_extensions su un nome derivato dalla docroot che
# non finisce in .php.
#
# Sulle pagine non si vedeva, perche' li' il nome finisce davvero in .php.
# Si vedeva su /php-fpm-status e /healthz-php, che non sono file: le due
# sonde del pool rispondevano 403 "Access denied." invece di "pong" e
# della pagina di stato, e il gestore di ping.path / pm.status_path non
# veniva nemmeno raggiunto. Verificato isolando la richiesta con cgi-fcgi:
# stessi parametri senza PATH_INFO -> "pong".
#
# Se un domani servisse il path info (REST con permalink PATH_INFO, un
# front controller che lo usa), va reintrodotto in uno snippet a parte,
# incluso SOLO dalle location che lo richiedono - mai in quelle diagnostiche.

# PATH_TRANSLATED non va inviato, e la ragione non e' ovvia.
#
# Con cgi.fix_pathinfo = 0 (impostato in 99-wordpress.ini, ed e' la
# scelta giusta per sicurezza), php-fpm NON usa SCRIPT_FILENAME per
# decidere cosa eseguire: usa PATH_TRANSLATED, se lo riceve.
#
# Su una richiesta normale come "/index.php" il path info e' vuoto,
# quindi "$document_root$fastcgi_path_info" vale la sola docroot: una
# DIRECTORY, senza estensione .php. A quel punto scatta
# security.limit_extensions e php-fpm risponde 403 con il corpo
# "Access denied." - per OGNI singolo script, rendendo il sito
# completamente inaccessibile.
#
# PHP ricava PATH_TRANSLATED da solo quando serve. Non reintrodurlo.
fastcgi_param  QUERY_STRING       $query_string;
fastcgi_param  REQUEST_METHOD     $request_method;
fastcgi_param  CONTENT_TYPE       $content_type;
fastcgi_param  CONTENT_LENGTH     $content_length;
fastcgi_param  REQUEST_URI        $request_uri;
fastcgi_param  DOCUMENT_URI       $document_uri;
fastcgi_param  DOCUMENT_ROOT      $document_root;
fastcgi_param  SERVER_PROTOCOL    $server_protocol;
fastcgi_param  REQUEST_SCHEME     $scheme;
fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
fastcgi_param  SERVER_SOFTWARE    nginx;
fastcgi_param  REMOTE_ADDR        $remote_addr;
fastcgi_param  REMOTE_PORT        $remote_port;
fastcgi_param  SERVER_ADDR        $server_addr;
fastcgi_param  SERVER_PORT        $server_port;
fastcgi_param  SERVER_NAME        $host;
fastcgi_param  REDIRECT_STATUS    200;

# WordPress genera URL https guardando $_SERVER['HTTPS']. Impostarlo qui,
# dalla mappa su X-Forwarded-Proto, evita il blocco di codice che di
# solito si appiccica in fondo a wp-config.php.
fastcgi_param  HTTPS              $fcgi_https;

# L'IP che arriva a PHP e' gia' quello reale: ci pensa real_ip_header a
# risolvere la catena Traefik -> Varnish -> nginx.
fastcgi_param  HTTP_X_REAL_IP     $remote_addr;
