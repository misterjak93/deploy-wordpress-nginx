# =======================================================
# Hardening dei percorsi WordPress
# =======================================================
# Incluso nel server block PRIMA delle location generiche: nginx valuta le
# location regex nell'ordine in cui compaiono, quindi questi blocchi
# devono precedere "location ~ \.php$", altrimenti un PHP caricato in
# uploads verrebbe eseguito prima di arrivare qui.

# -------------------------------------------------------
# Esecuzione PHP nelle cartelle scrivibili
# -------------------------------------------------------
# E' la singola regola che trasforma "upload arbitrario" in "nessuna
# conseguenza". Qualunque .php dentro uploads, cache o upgrade non viene
# eseguito ne' servito.
location ~* ^/wp-content/(uploads|cache|upgrade|uploads-webpc|wphb-cache)/.*\.(php|phtml|phar|pht|php[0-9]|shtml|cgi|pl|py|asp|aspx|jsp|htaccess)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 403;
}

# Stessa cosa, ma per l'intero albero dei file caricati: qui non deve
# esistere nulla di eseguibile, punto.
location ~* /(?:uploads|files)/.*\.(?:php|phtml|phar)$ {
    deny all;
    return 403;
}

# -------------------------------------------------------
# File di sistema che non devono uscire
# -------------------------------------------------------
# Dotfile: .git, .env, .htaccess, .DS_Store. Eccezione per
# .well-known, che serve ad ACME e a apple-app-site-association.
location ~ /\.(?!well-known/) {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location = /wp-config.php        { deny all; return 404; }
location = /wp-config-sample.php { deny all; return 404; }
location = /readme.html          { deny all; return 404; }
location = /license.txt          { deny all; return 404; }
location = /wp-admin/install.php { deny all; return 404; }
location = /wp-admin/setup-config.php { deny all; return 404; }

# debug.log finisce in wp-content quando WP_DEBUG_LOG e' attivo, ed e' una
# miniera di percorsi assoluti, query e a volte credenziali.
location ~* ^/wp-content/(debug\.log|uploads/wp-file-manager-pro/fm_backup/) {
    deny all;
    return 404;
}

# -------------------------------------------------------
# File sorgente e di build lasciati in docroot
# -------------------------------------------------------
location ~* \.(?:sql|bak|bkp|old|orig|save|swp|swo|tmp|log|ini|conf|dist|env|sh|bash|lock|yml|yaml|twig|tpl|sqlite3?)$ {
    deny all;
    access_log off;
    return 404;
}

location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|webpack\.config\.js|gulpfile\.js|Gruntfile\.js|\.eslintrc.*|phpunit\.xml.*)$ {
    deny all;
    return 404;
}

# -------------------------------------------------------
# Enumerazione utenti
# -------------------------------------------------------
# /?author=1 rivela lo slug di login di ogni utente con un redirect.
# Prima tappa di ogni brute force: senza username validi, la lista
# password non serve a niente.
location = /index.php {
    if ($arg_author) {
        return 403;
    }
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php-fpm.sock;
}

# La REST API espone la stessa lista su /wp-json/wp/v2/users.
# Bloccata per gli anonimi; chi e' loggato passa (il pannello ne ha
# bisogno per l'assegnazione degli autori).
location ~ ^/wp-json/wp/v2/users {
    if ($wp_authenticated = 0) {
        return 401;
    }
    try_files $uri $uri/ /index.php?$args;
}

# -------------------------------------------------------
# Rumore di fondo
# -------------------------------------------------------
location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$args; }
location = /favicon.ico { access_log off; log_not_found off; try_files $uri =204; }
