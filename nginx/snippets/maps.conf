# =======================================================
# Mappe condivise (contesto http)
# =======================================================

# HSTS solo quando la richiesta e' arrivata in HTTPS al bordo. Con valore
# vuoto nginx non emette affatto l'header: niente HSTS sulle chiamate
# interne in HTTP (healthcheck, purge), dove sarebbe solo rumore.
map $http_x_forwarded_proto $hsts_header {
    https       "max-age=31536000; includeSubDomains";
    default     "";
}

# $_SERVER['HTTPS'] per PHP. WordPress decide da qui se generare URL
# https, ed e' il motivo per cui non serve il classico blocco
# X-Forwarded-Proto dentro wp-config.php.
map $http_x_forwarded_proto $fcgi_https {
    https       "on";
    default     "";
}

# Negoziazione immagini di nuova generazione.
# I suffissi vuoti fanno collassare il try_files sul file originale.
map $http_accept $img_avif {
    default     "";
    "~*image/avif"  ".avif";
}
map $http_accept $img_webp {
    default     "";
    "~*image/webp"  ".webp";
}

# Utenti che devono vedere sempre contenuto fresco. Serve a nginx per
# marcare la risposta come non cacheabile a valle (Varnish ha la sua
# logica equivalente in VCL, questo e' il secondo strato).
map $http_cookie $wp_authenticated {
    default     0;
    "~*(wordpress_logged_in_|comment_author_|wp-postpass_|woocommerce_items_in_cart|wp_woocommerce_session_)"  1;
}

# Enumerazione utenti: le due strade che $arg_author e la location
# /wp-json/wp/v2/users non coprono.
#
# WordPress espone la REST API anche come parametro di query
# (/?rest_route=/wp/v2/users). Quella richiesta non passa mai dalla
# location che protegge /wp-json/, quindi la lista utenti usciva lo stesso.
map $arg_rest_route $rest_utenti {
    default             0;
    "~*^/wp/v2/users"   1;
}

# Chi puo' leggerla: solo una sessione WordPress. Le due mappe si combinano
# perche' un "if" di nginx non sa fare AND.
map "$rest_utenti$wp_authenticated" $rest_utenti_blocca {
    default 0;
    "10"    1;
}

# ?author=1 e ?author[]=1 chiedono la stessa cosa, ma $arg_author vede solo
# la prima: con la sintassi array il nome del parametro e' "author[]".
map $args $arg_autore {
    default                             0;
    "~*(^|&)author(%5[Bb]%5[Dd]|\[\])?=" 1;
}

# Chiamate interne allo stack. Serve a proteggere gli endpoint
# diagnostici nella fase di rewrite: "allow/deny" agisce nella fase di
# access, che viene DOPO, quindi una location che risponde con "return"
# non verrebbe mai filtrata (vedi /healthz in wordpress.conf).
#
# Il controllo NON guarda $remote_addr, e la differenza non e' teorica:
# quella variabile la riscrive real_ip a partire da X-Forwarded-For, che
# e' scritto dal client. Con set_real_ip_from esteso a tutto lo spazio
# privato, una catena fatta di soli indirizzi privati farebbe adottare a
# nginx il primo della lista - cioe' proprio quello scritto da chi manda
# la richiesta.
#
# Si guardano invece due cose che il client non controlla:
#
#   1. $realip_remote_addr, l'indirizzo che ha davvero aperto la
#      connessione TCP (Varnish, o 127.0.0.1 per il preload e le sonde);
#   2. quanti indirizzi ci sono in X-Forwarded-For. E' lo stesso
#      discriminante del PURGE nel VCL: una chiamata interna ne ha zero o
#      uno, una arrivata dal bordo ne ha almeno due, perche' Traefik
#      accoda il peer pubblico e Varnish accoda Traefik. Un client che
#      ne falsifica uno non puo' togliere quelli che gli vengono
#      accodati dopo: aggiungerne fa solo crescere la catena.
geo $realip_remote_addr $peer_interno {
    default         0;
    127.0.0.0/8     1;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
}

map $http_x_forwarded_for $xff_dal_bordo {
    default     0;
    "~,"        1;
}

# Un "if" di nginx non sa fare AND: interno = peer privato E catena corta.
map "$peer_interno$xff_dal_bordo" $client_interno {
    default 0;
    "10"    1;
}
